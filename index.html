<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#39ac4b" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/rmb_logo_icon.svg" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Google Fonts: Montserrat (Preconnect & Load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <meta name="google-site-verification" content="google-site-verification-token" />
    <meta name="msvalidate.01" content="msvalidate-token" />

    <!-- Default SEO Metadata (Overridden per-page by SEOHead / react-helmet-async) -->
    <title>RBM Infracon Limited | EPC Services – Engineering, Procurement & Construction</title>
    <meta
      name="description"
      content="RBM Infracon Limited (NSE: RBMINFRA) – 30+ years of trusted EPC services in Engineering, Procurement, Construction, Operations & Maintenance across India and the Middle East. ISO 9001:2015 certified."

    <link rel="canonical" href="https://www.rbminfracon.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Bing) -->
    <meta property="og:site_name" content="RBM Infracon Limited" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://www.rbminfracon.com/" />
    <meta property="og:title" content="RBM Infracon Limited | EPC Services – Engineering, Procurement & Construction" />
    <meta
      property="og:description"
      content="30+ years of trusted EPC services – Engineering, Procurement, Construction, O&M across India and the Middle East."
    />
    <meta property="og:image" content="https://www.rbminfracon.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://www.rbminfracon.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RBM Infracon Limited Logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RBM Infracon Limited | EPC Services" />

      name="twitter:description"
